name: Generate Original Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Clean Web Directory and Setup Latest Capacitor
      run: |
        rm -f package.json package-lock.json 2>/dev/null || true
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp style.css www/ 2>/dev/null || true
        cp script.js www/ 2>/dev/null || true
        cp manifest.json www/ 2>/dev/null || true
        cp *.js www/ 2>/dev/null || true
        cp *.png www/ 2>/dev/null || true
        
        # 1. फ़ायरबेस एरर पॉप-अप रोकने के लिए सर्विस वर्कर रजिस्ट्रेशन को बायपास करना
        sed -i 's/navigator.serviceWorker.register/console.log("SW Disabled"); \/\/navigator.serviceWorker.register/g' www/*.js 2>/dev/null || true
        
        # 2. नोटिफिकेशन पॉलीफिल सेट करना
        sed -i 's/<head>/<head><script>window.Notification = { permission: "granted" };<\/script>/' www/index.html
        
        npm init -y
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest
        npx cap init "Fazal-e-karam" "com.pathancoder.fazalekaram" --web-dir=www
        npx cap add android
        npx cap sync

    - name: Set App Custom Logo (Direct Method)
      run: |
        RES_DIR="android/app/src/main/res"
        cp 3857.png $RES_DIR/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
        cp 3857.png $RES_DIR/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
        cp 3857.png $RES_DIR/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
        cp 3857.png $RES_DIR/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
        cp 3857.png $RES_DIR/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
        
        cp 3859.png $RES_DIR/mipmap-mdpi/ic_launcher_round.png 2>/dev/null || true
        cp 3859.png $RES_DIR/mipmap-hdpi/ic_launcher_round.png 2>/dev/null || true
        cp 3859.png $RES_DIR/mipmap-xhdpi/ic_launcher_round.png 2>/dev/null || true
        cp 3859.png $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png 2>/dev/null || true
        cp 3859.png $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png 2>/dev/null || true

    - name: Inject Android Native Push and Alarm Permissions
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />' $MANIFEST_PATH

    - name: Build Android APK
      run: |
        cd android
        rm -rf .gradle/
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --no-build-cache
        
    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Native-Android-App
        path: android/app/build/outputs/apk/debug/app-debug.apk

