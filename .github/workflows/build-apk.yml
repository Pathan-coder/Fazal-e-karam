name: Generate Original Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Capacitor and Build Setup
      run: |
        npm install -g @capacitor/cli @capacitor/core
        npx cap init "Fazal-e-karam" "com.pathancoder.fazalekaram" --web-dir=.
        npx cap add android

    - name: Build Android APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Package
      uses: actions/upload-artifact@v4
      with:
        name: Native-Android-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
